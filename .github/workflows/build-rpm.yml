name: Build RPM

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-24.04
    # Сборка выполняется внутри EL9 (AlmaLinux 9) — та же платформенная база,
    # что у РЕД ОС 8: glibc 2.34, OpenSSL 3, GTK4. Пакет, собранный на Ubuntu,
    # требует GLIBC/GTK/OpenSSL из Ubuntu и на РЕД ОС не запускается.
    container:
      image: almalinux:9
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies (EL9)
        run: |
          dnf -y install dnf-plugins-core epel-release rsync tar gzip
          dnf config-manager --set-enabled crb
          dnf -y install --setopt=install_weak_deps=False \
            gcc make perl pkg-config \
            gtk4-devel pango-devel cairo-devel cairo-gobject-devel \
            gdk-pixbuf2-devel graphene-devel libepoxy-devel \
            glib2-devel openssl-devel \
            zlib-devel dejavu-sans-fonts \
            rpm-build xorg-x11-server-Xvfb

      - name: Install Rust (stable)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Vendor crates (offline dependencies)
        run: |
          # vendor/ пересоздаём через cargo vendor — контрольные суммы
          # гарантированно совпадают с Cargo.lock
          rm -rf vendor .cargo
          cargo vendor vendor > /dev/null
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = "vendored-sources"

          [source.vendored-sources]
          directory = "vendor"

          [net]
          offline = true
          EOF

      - name: Build release binary
        run: cargo build --release --offline

      - name: Smoke test (приложение должно запускаться)
        run: |
          # Реальный запуск GUI в виртуальном X-сервере: если бинарнику не
          # хватает библиотек/символов или он падает при старте — job падает.
          export GSK_RENDERER=cairo
          export REMOTIX_MASTER_PASSWORD=ci-smoke-test
          timeout 20 xvfb-run -a ./target/release/remotix > /tmp/smoke.log 2>&1
          code=$?
          echo "exit code: $code (124 = приложение работало до таймаута)"
          cat /tmp/smoke.log || true
          if [ "$code" -ne 124 ]; then
            echo "::error::приложение завершилось с кодом $code — RPM не собираем"
            exit 1
          fi

      - name: Show ELF dependencies
        run: |
          ldd target/release/remotix
          echo '--- максимальная требуемая версия glibc ---'
          objdump -T target/release/remotix | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - name: Prepare RPM sources
        run: |
          VERSION=1.0.0
          NAME=remotix-${VERSION}
          mkdir -p "$HOME/rpmbuild/SOURCES"

          # Дерево исходников без служебных каталогов (vendor оставляем: он
          # попадает и в Source0, и отдельным архивом Source1)
          rsync -a --exclude .git --exclude target --exclude .github ./ "/tmp/$NAME/"

          tar -czf "$HOME/rpmbuild/SOURCES/remotix-vendor-${VERSION}.tar.gz" -C "/tmp/$NAME" vendor
          cp "/tmp/$NAME/Cargo.lock" "$HOME/rpmbuild/SOURCES/"
          tar -czf "$HOME/rpmbuild/SOURCES/${NAME}.tar.gz" -C /tmp "$NAME"

      - name: Build RPM
        run: |
          # Зависимости установлены через dnf (см. выше); --nodeps отключает
          # проверку BuildRequires по именам пакетов РЕД ОС (cargo/rust идут
          # из rustup, а не из rpm).
          rpmbuild -ba packaging/remotix.spec --nodeps

      - name: Check RPM dependencies
        run: |
          rpm -qpi "$HOME"/rpmbuild/RPMS/*/remotix-*.rpm | head -20
          echo '--- Requires ---'
          rpm -qp --requires "$HOME"/rpmbuild/RPMS/*/remotix-*.rpm

      - name: Show results
        run: |
          ls -lh "$HOME/rpmbuild/RPMS/"*/ "$HOME/rpmbuild/SRPMS/"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp "$HOME"/rpmbuild/RPMS/*/remotix-*.rpm dist/
          cp "$HOME"/rpmbuild/SRPMS/remotix-*.rpm dist/
          ls -lh dist/

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotix-rpm
          path: dist/remotix-*.rpm
          if-no-files-found: error

      - name: Attach RPM to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/remotix-*.rpm
