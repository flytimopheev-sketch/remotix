name: Build RPM

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm \
            libgtk-4-dev \
            libssh2-1-dev \
            libssl-dev \
            libsqlite3-dev \
            libvte-2.91-gtk4-dev \
            pkg-config

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare RPM sources
        run: |
          VERSION=1.0.0
          NAME=remotix-${VERSION}
          mkdir -p "$HOME/rpmbuild/SOURCES"

          # Дерево исходников без служебных каталогов
          rsync -a --exclude .git --exclude target --exclude .github ./ "/tmp/$NAME/"

          # vendor/ пересоздаём через cargo vendor — контрольные суммы гарантированно
          # совпадают (в git файлы могли измениться при конверсии переводов строк)
          cd "/tmp/$NAME"
          rm -rf vendor
          # .cargo/config.toml из репозитория включает offline-режим и vendored
          # sources — для cargo vendor на CI он не нужен
          rm -rf .cargo
          cargo vendor vendor > /dev/null
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = "vendored-sources"

          [source.vendored-sources]
          directory = "vendor"

          [net]
          offline = true
          EOF

          tar -czf "$HOME/rpmbuild/SOURCES/remotix-vendor-${VERSION}.tar.gz" -C "/tmp/$NAME" vendor
          cp Cargo.lock "$HOME/rpmbuild/SOURCES/"

          tar -czf "$HOME/rpmbuild/SOURCES/${NAME}.tar.gz" -C /tmp "$NAME"

      - name: Build RPM
        run: |
          # Зависимости установлены через apt (см. выше); --nodeps отключает
          # проверку BuildRequires по именам пакетов RED OS (cargo, gtk4-devel и т.д.)
          rpmbuild -ba packaging/remotix.spec --nodeps

      - name: Show results
        run: |
          ls -lh "$HOME/rpmbuild/RPMS/"*/ "$HOME/rpmbuild/SRPMS/"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp "$HOME"/rpmbuild/RPMS/*/remotix-*.rpm dist/
          cp "$HOME"/rpmbuild/SRPMS/remotix-*.rpm dist/
          ls -lh dist/

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotix-rpm
          path: dist/remotix-*.rpm
          if-no-files-found: error

      - name: Attach RPM to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/remotix-*.rpm
