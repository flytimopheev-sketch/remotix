[package]
name = "remotix"
version = "1.0.0"
edition = "2021"
description = "Remotix — клиент удалённого доступа (RDP/VNC/SSH) для РЕД ОС"
license = "MIT"
authors = ["flytimopheev <flytimopheev@gmail.com>"]

[dependencies]
# gtk4 0.9 — последний стек, совместимый с библиотеками EL9/РЕД ОС.
# ВАЖНО: у gtk4-rs фича v4_6 тянет pango/v1_50, а в EL9 Pango 1.48 —
# поэтому максимум v4_4 (привязки ограничены GTK 4.4 / Pango 1.44;
# при использовании API 4.6+ компиляция упадёт с явной ошибкой).
gtk4 = { version = "0.9", features = ["v4_4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
ssh2 = "0.9"
chrono = "0.4"
# Динамическая загрузка VTE для GTK4 (libvte-2.91-gtk4.so.0) во время
# выполнения: пакет не требует VTE жёстко (в EL9/RHEL9 его нет) и работает
# с упрощённым терминалом, если библиотека не установлена.
libloading = "0.8"

# RDP: чисто-растовый IronRDP (без системного FreeRDP — RPM не требует
# freerdp-devel/freerdp-libs, всё вендорено в vendor/ и собирается офлайн).
ironrdp-blocking = "0.10.0"
ironrdp-connector = "0.10.0"
ironrdp-session = "0.11.0"
ironrdp-pdu = { version = "0.9.0", features = ["std"] }
ironrdp-graphics = "0.9.0"
ironrdp-dvc = "0.8.0"
ironrdp-displaycontrol = "0.8.0"
ironrdp-echo = "0.4.0"
# TLS для RDP (rustls + ring — чистый Rust, без openssl для RDP-канала)
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
